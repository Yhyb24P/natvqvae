[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natvqvae"
version = "0.0.1"
description = "Computational design of KVP40 NatV variants for net NAD+ synthesis"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.81",
    "numpy>=1.24",
    "torch>=2.1",
    "transformers>=4.40",
    "safetensors>=0.4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
md = ["rdkit>=2023.9", "parmed>=4.0", "networkx>=3.0",
      "MDAnalysis>=2.7", "pandas>=2.0"]

[project.scripts]
natvqvae = "natvqvae.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

  clone_variants: data/results/evaluation/kvp40_epcr_full_length_structures/variants.csv
  clone_sanger: data/results/evaluation/kvp40_epcr_full_length_structures/sanger_verification.json
  clone_build: data/results/evaluation/kvp40_epcr_full_length_structures/build.json
  design_report: data/results/evaluation/natv_dual_domain_design/REPORT.md
  full_length_report: data/results/evaluation/kvp40_epcr_full_length_structures/REPORT.md
  nmnat_environment_report: data/results/evaluation/kvp40_epcr_nmnat_environment/REPORT.md
  clone_source_run: kvp40_epcr_20261009
evidence:
  - package: evidence/design_candidates_original.csv
    source: data/results/generation/natv_dual_domain_design/candidates.csv
    description: original 12-design candidate table before unification
  - package: evidence/design.json
    source: data/results/generation/natv_dual_domain_design/design.json
    description: design batch provenance
  - package: evidence/design.yaml
    source: config/design.yaml
    description: historical design configuration
  - package: evidence/random_seed8301_generation.json
    source: data/results/generation/natv_transfer/random_seed8301/generation.json
    description: random_seed8301 generation provenance
  - package: evidence/random_seed8303_generation.json
    source: data/results/generation/natv_transfer/random_seed8303/generation.json
    description: random_seed8303 generation provenance
  - package: evidence/clone_variants.csv
    source: data/results/evaluation/kvp40_epcr_full_length_structures/variants.csv
    description: ePCR WT/NatV10/NatV89 sequences, edits and SHA
  - package: evidence/clone_sanger_verification.json
    source: data/results/evaluation/kvp40_epcr_full_length_structures/sanger_verification.json
    description: tracked Sanger verification records
  - package: evidence/clone_build.json
    source: data/results/evaluation/kvp40_epcr_full_length_structures/build.json
    description: ePCR build provenance and AB1 SHA manifest

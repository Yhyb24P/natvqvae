<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="130mm" viewBox="0 0 680 520" data-generator="fireworks-tech-graph" data-style-id="1" data-diagram-type="architecture" role="img" aria-labelledby="qvae-paths-title qvae-paths-desc"><title id="qvae-paths-title">QVAE information paths</title><desc id="qvae-paths-desc">The full-sequence posterior supports training and importance scoring; generation samples the context-conditioned prior.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59717D"/></marker></defs><text x="20" y="28" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="start" fill="#203744">QVAE: posterior inference and prior generation</text><rect x="20" y="70" width="170" height="64" rx="5" fill="#EAF1F4" stroke="#59717D"/><text x="105.0" y="97.5" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">Full-sequence</text><text x="105.0" y="114.5" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">ESM features</text><rect x="230" y="70" width="180" height="64" rx="5" fill="#EAF1F4" stroke="#59717D"/><text x="320.0" y="97.5" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">Posterior</text><text x="320.0" y="114.5" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">q(z | full, context, M)</text><rect x="460" y="70" width="180" height="64" rx="5" fill="#EAF1F4" stroke="#59717D"/><text x="550.0" y="97.5" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">Posterior z</text><text x="550.0" y="114.5" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">Train / importance</text><rect x="20" y="215" width="170" height="64" rx="5" fill="#EAF1F4" stroke="#59717D"/><text x="105.
<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="162.5mm" viewBox="0 0 680 650" data-generator="fireworks-tech-graph" data-style-id="1" data-diagram-type="architecture" role="img" aria-labelledby="study-design-title study-design-desc"><title id="study-design-title">NatV study and probability mixing</title><desc id="study-design-desc">Annotated targets, controlled training conditions, and arithmetic mixing of frozen pretrained and trained task-head probabilities.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59717D"/></marker></defs><rect width="680" height="650" fill="white"/><text x="20" y="24" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="start" fill="#203744">A  NatV masking task</text><text x="20" y="48" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="start" fill="#203744">KVP40 reference: 341 residues</text><rect x="35" y="65" width="324" height="30" rx="5" fill="#E0EEEE" stroke="#59717D"/><text x="197.0" y="84.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">NMNAT 4–181</text><rect x="359" y="65" width="40" height="30" rx="5" fill="#EAF1F4" stroke="#59717D"/><rect x="399" y="65" width="246" height="30" rx="5" fill="#FAEAD8" stroke="#59717D"/><text x="522.0" y="84.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">Nudix 204–338</text><text x="379" y="56" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">182–203</text><rect x="80" y="100" width="8" height="8" fill="#203744"/><rect x="150" y="100" width="8" height="8" fill="#203744"/><rect x="240" y="100" width="8" height="8" fill="#203744"/><rect x="480" y="100" width="8" height="8" fill="#203744"/><rect x="590" y="100" width="8" height="8" fill="#203744"/><text x="30" y="118" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="start" fill="#203744">Dark marks: illustrative targets; other residues remain visible</text><text x="30" y="139" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="start" fill="#203744">27 panels; homolog-specific coordinates; all panels is weighted</text><text x="20" y="179" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="start" fill="#203744">B  Original controlled comparison</text><text x="20" y="204" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="start" fill="#203744">1,437 external/self fragment pairs: matched target columns and budgets</text><text x="325" y="231" font-family="DejaVu Sans" font-size="13" font-weight="bold" text-anchor="middle" fill="#203744">QVAE</text><text x="535" y="231" font-family="DejaVu Sans" font-size="13" font-weight="bold" text-anchor="middle" fill="#203744">Deterministic</text><text x="25" y="266" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="start" fill="#203744">No auxiliary stage</text><rect x="245" y="245" width="160" height="30" rx="5" fill="#EAF1F4" stroke="#59717D"/><text x="325.0" y="264.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">3 pipeline replicates</text><rect x="455" y="245" width="160" height="30" rx="5" fill="#EAF1F4" stroke="#59717D"/><text x="535.0" y="264.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">3 pipeline replicates</text><text x="25" y="304" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="start" fill="#203744">Self fragments</text><rect x="245" y="283" width="160" height="30" rx="5" fill="#EAF1F4" stroke="#59717D"/><text x="325.0" y="302.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">3 pipeline replicates</text><rect x="455" y="283" width="160" height="30" rx="5" fill="#EAF1F4" stroke="#59717D"/><text x="535.0" y="302.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">3 pipeline replicates</text><text x="25" y="342" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="start" fill="#203744">External fragments</text><rect x="245" y="321" width="160" height="30" rx="5" fill="#EAF1F4" stroke="#59717D"/><text x="325.0" y="340.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">3 pipeline replicates</text><rect x="455" y="321" width="160" height="30" rx="5" fill="#EAF1F4" stroke="#59717D"/><text x="535.0" y="340.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">3 pipeline replicates</text><text x="20" y="376" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="start" fill="#203744">C  Exploratory mixed prediction: existing no-auxiliary task weights</text><rect x="20" y="395" width="175" height="32" rx="5" fill="#EAF1F4" stroke="#59717D"/><text x="107.5" y="415.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">Same masked sequence</text><rect x="20" y="465" width="175" height="56" rx="5" fill="#EAF1F4" stroke="#59717D"/><text x="107.5" y="488.5" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">Frozen ESM-2</text><text x="107.5" y="505.5" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">encoder</text><rect x="255" y="425" width="180" height="48" rx="5" fill="#EAF1F4" stroke="#59717D"/><text x="345.0" y="444.5" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">Original ESM head</text><text x="345.0" y="461.5" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">Normalized 20AA pE</text><rect x="255" y="530" width="180" height="66" rx="5" fill="#FAEAD8" stroke="#59717D"/><text x="345.0" y="550.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">Trained deterministic</text><text x="345.0" y="567.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">task model (one seed)</text><text x="345.0" y="584.0" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">Normalized 20AA pD</text><rect x="490" y="470" width="170" height="70" rx="5" fill="#E0EEEE" stroke="#59717D"/><text x="575.0" y="500.5" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">Arithmetic pool</text><text x="575.0" y="517.5" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#203744">pM = 0.5 pE + 0.5 pD</text><polyline points="107,427 107,465" fill="none" stroke="#59717D" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="195,484 223,484 223,449 255,449" fill="none" stroke="#59717D" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="195,504 223,504 223,563 255,563" fill="none" stroke="#59717D" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="435,449 465,449 465,489 490,489" fill="none" stroke="#59717D" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="435,563 465,563 465,521 490,521" fill="none" stroke="#59717D" stroke-width="1.6" marker-end="url(#arrow)"/><text x="20" y="624" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="start" fill="#203744">Mix and score each seed separately; then average scores</text><text x="20" y="643" font-family="DejaVu Sans" font-size="12.5" font-weight="normal" text-anchor="start" fill="#203744">Prior six-cell generation is separate from the mixed predictor</text></svg>
name: scientific-contracts
on:
  push:
    branches: [main, "research/**"]
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src/natvqvae
      - run: python -m pytest -q
      # The legacy data and GPU checkpoints are intentionally not in CI.
      # A PASS proves only the isolated code/contracts, not science or local asset availability.

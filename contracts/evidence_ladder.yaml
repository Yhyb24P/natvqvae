schema_version: natvqvae-evidence-ladder
status: interpretation_rules_only_no_run_authorization

principle: >-
  Maintain separate evidence dimensions. Record PASS/FAIL/UNKNOWN/NOT_APPLICABLE
  per check; never convert an unmeasured dimension into PASS or FAIL.
  No model-derived total score may be named predicted catalytic efficiency or net NAD+ yield.

evaluation:
  sequence:
    intent: "Identify reproducible, traceable candidates and their relation to NatV."
    observations: [canonical_sequence, double_domain_annotation, changes_from_reference, novelty, duplicates, training_similarity]
    rule: "For a defined WT-substitution experiment enforce that experiment's edit contract only; other generators have separate sequence contracts."
  predicted_structure:
    intent: "Investigate candidate-specific full-length fold and domain arrangement."
    observations: [per_domain_confidence, domain_correspondence, interface_geometry, local_disruption, model_route_and_templates]
    rule: "WT-based confidence cutoffs require route-specific calibration; no fold means UNKNOWN, not rejected-by-fold."
  catalytic_context:
    intent: "Generate mechanistic hypotheses about NMNAT production and Nudix hydrolysis."
    observations: [nmnat_motif_and_second_shell, NMN_ATP_Mg_context_if_supported, nudix_NAD_hydrolysis_region, domain_organization]
    rule: "No docking or structural observation can be asserted as a change in kcat or NAD+ hydrolysis rate."
  candidate_panel:
    intent: "Select diverse, informative designs under a predeclared compute and sampling budget."
    observations: [design_hypothesis_A_B_C, sequence_diversity, structural_uncertainty, complementary_mechanisms, comparison_baselines]
    rule: "Preserve proposal denominators and UNKNOWN evaluations; no retroactively tuned universal threshold."

uncertainty:
  allowed_statuses: [PASS, FAIL, UNKNOWN, NOT_APPLICABLE]
  rule: "Thresholds, if useful, are specific to a validated reader, scope and run, and frozen before candidate scores are reviewed."

comparator_policy:
  models: "QVAE plus a defensible no-latent SE and any justified simple comparator on matched data and compute."
  candidate_controls: [KVP40_WT, matched_simple_generator, appropriate_natural_homologs]
  future_wet_lab_controls: [KVP40_WT, nudix_catalytic_dead_if_verified, nmnat_catalytic_dead_negative]
  note: "An unverified catalytic-dead design is not a measured control or a prerequisite for recording computation."

nonclaims:
  - plddt_is_not_activity
  - docking_is_not_catalytic_rate
  - family_likelihood_is_not_NAD_net_production
  - structural_prediction_models_may_share_training_or_template_priors
  - reduced_Nudix_proxy_binding_does_not_prove_reduced_hydrolysis

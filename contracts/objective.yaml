schema_version: natvqvae-objective
status: active_scientific_objective_not_a_run_authorization
scope: in_vitro_purified_enzyme

biochemistry:
  scaffold: KVP40_NatV_341aa
  nmnat_reaction: "NMN + ATP <=> NAD+ + PPi"
  nudix_nad_hydrolysis: "NAD+ + H2O -> NMN + AMP"
  requirement: "Retain meaningful NMNAT synthesis; Nudix NAD+ hydrolysis may decline or be lost."
  structural_caveat: "Nudix may also stabilize domain organization; catalytic attenuation does not imply safe deletion."

application_endpoint:
  name: net_NAD_accumulation
  example_normalisation: "([NAD+](T) - [NAD+](0)) / total_enzyme_input"
  experiment_only: true
  conditions_to_fix: [enzyme_amount_and_normalisation, NMN, ATP, Mg2plus, pH, temperature, time_window, PPi_handling]
  meaning: "Compare WT and candidates at matched assay conditions; not a computational activity label."
  interpretations:
    - "Net accumulation can improve through more formation, less hydrolysis, or both."
    - "An initial rate, kcat/Km and fixed-time accumulation are distinct endpoints."
    - "Two-substrate apparent Km depends on the other substrate concentration."

separate_experimental_endpoints:
  synthesis: [initial_NAD_formation_rate, kcat_if_identifiable, Km_NMN_apparent, Km_ATP_apparent]
  degradation: [NAD_hydrolysis_rate]
  integrated: [NAD_accumulation_timecourse, substrate_conversion, ATP_consumption, stability]

design_hypotheses:
  A: "Change the NMNAT environment to seek improved synthesis while retaining catalytic competence."
  B: "Change Nudix substrate/catalytic behavior to reduce NAD+ hydrolysis while preserving a competent NMNAT scaffold."
  C: "Combine NMNAT and Nudix changes; mechanism must not be inferred from the class label."
  note: "These labels classify generated candidates, not required models or guaranteed activity outcomes."

current_WT_editing_pilot:
  reference: contracts/regions.json
  allowed_length: 341
  substitutions_only: true
  meaning: "Local controlled editing scope only; not a universal constraint on future NatV family generation."

not_currently_supported:
  - "Prediction of catalytic rates or net NAD+ output from structure/model scores."
  - "Claims that designed proteins are more active before biochemical measurements."
  - "Unconditional full-family generation by the current masked-recovery generator interface."
  - "Extrapolation to cellular NAD metabolism."

future_experimental_controls:
  WT: required
  nudix_catalytic_dead_structurally_intact: proposed_not_yet_verified
  nmnat_catalytic_dead: proposed_negative
  claim_limit: "Controls are hypotheses until measured; no wet-lab run is authorized here."

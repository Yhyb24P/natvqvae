schema_version: natvqvae-objective
status: active_scientific_objective_not_a_run_authorization
scope: in_vitro_purified_enzyme

biochemistry:
  scaffold: KVP40_NatV_341aa
  nmnat_reaction: "NMN + ATP <=> NAD+ + PPi"
  nudix_nad_hydrolysis: "NAD+ + H2O -> NMN + AMP"
  requirement: "Retain meaningful NMNAT synthesis; Nudix NAD+ hydrolysis may decline or be lost."
  structural_caveat: "Nudix may also stabilize domain organization; catalytic attenuation does not imply safe deletion."

application_endpoint:
  name: net_NAD_accumulation
  example_normalisation: "([NAD+](T) - [NAD+](0)) / total_enzyme_input"
  experiment_only: true
  conditions_to_fix: [enzyme_amount_and_normalisation, NMN, ATP, Mg2plus, pH, temperature, time_window, PPi_handling]
  meaning: "Compare WT and candidates at matched assay conditions; not a computational activity label."

design_hypotheses:
  A: "Seek improved NMNAT synthesis with catalytic competence retained."
  B: "Seek reduced Nudix NAD+ hydrolysis while preserving NMNAT competence and double-domain organization."
  C: "Explore both in one candidate; mechanism is not determined by the class label."

current_generation_research:
  task: WT_conditioned_conservative_editing
  WT_length: 341
  WT_reference: contracts/regions.json
  candidate_similarity: "global Levenshtein identity 0.90 to 1.00 inclusive, using max(candidate_length, 341) as denominator"
  design_modes: [multi_site_substitution, short_indel_with_conditional_local_repair]
  exploratory_short_indel: "one local insertion or deletion event, 1 to 3 residues; applicability unverified"
  edit_representation: [KEEP, SUB, INSERT, DELETE]
  note: "Scientific design space; sampling capability must be demonstrated, not inferred from previous models."

historical_substitution_pilot:
  reference: contracts/regions.json
  allowed_length: 341
  substitutions_only: true
  meaning: "Existing A/B/C position masks and no-InDel assertions describe historical fixed-length runs only."

separate_experimental_endpoints:
  synthesis: [initial_NAD_formation_rate, kcat_if_identifiable, Km_NMN_apparent, Km_ATP_apparent]
  degradation: [NAD_hydrolysis_rate]
  integrated: [NAD_accumulation_timecourse, substrate_conversion, ATP_consumption, stability]

future_experimental_controls:
  WT: required
  nudix_catalytic_dead_structurally_intact: proposed_not_yet_verified
  nmnat_catalytic_dead: proposed_negative

nonclaims:
  - "Sequence identity does not establish enzyme activity."
  - "Model, structure and docking metrics do not estimate net NAD+ accumulation."
  - "Legacy gap sampling is not validated InDel engineering."
